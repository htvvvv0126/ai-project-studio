@media(max-width:650px){body[data-view="lesson"] .lesson-actions{flex-direction:column;align-items:stretch}body[data-view="lesson"] .lesson-actions>.btn{width:100%;flex:none;white-space:nowrap}body[data-view="home"] .stage-meta{display:flex;flex-direction:row;align-items:center;gap:10px;margin-left:48px}body[data-view="home"] .stage-visual-status{margin-left:0!important}}

body[data-view="lesson"] .drill{border-color:var(--line);border-radius:0}

body[data-view="lesson"] .drill form{padding:20px 0}
body[data-view="lesson"] .drill label,body[data-view="lesson"] .drill legend{font-size:15px;line-height:1.8}

body[data-view="lesson"] [id]{scroll-margin-top:100px}

/* Shared tokens and components, extended from the confirmed learning desktop. */
:root{--motion-nav:180ms;--motion-card:200ms;--motion-details:250ms;--motion-entry:350ms;--motion-progress:400ms;--control-radius:999px;--card-padding:28px;--section-gap:32px}
.sidebar{overflow-y:auto}
body:not([data-view="welcome"]) .sidebar nav button{transition:background-color var(--motion-nav) ease,color var(--motion-nav) ease}
body:not([data-view="welcome"]) .page-title,.levels-hero h1{font-size:48px;font-weight:600;line-height:1.2;letter-spacing:-.025em}
body:not([data-view="welcome"]) .page-description{font-size:17px;line-height:1.8;max-width:70ch;color:var(--muted)}
body:not([data-view="welcome"]) .page-intro{margin-bottom:32px}
body:not([data-view="welcome"]) :is(.side-panel,.exam-card,.practice-panel,.project-spec,.note-item,.resource-list,.glossary-grid,.learning-panel,.review-panel,.practice-drills,.tool-comparison){border-color:#e5e5ea;border-radius:24px;box-shadow:none}
body:not([data-view="welcome"]) :is(.side-panel,.exam-card,.practice-panel,.project-spec,.note-item,.review-panel,.practice-drills,.tool-comparison){padding:var(--card-padding)}
body:not([data-view="welcome"]) :is(.side-panel,.exam-card,.practice-panel,.review-panel,.tool-comparison)>h2{font-size:23px;line-height:1.5;font-weight:600;margin:0 0 16px}
body:not([data-view="welcome"]) :is(.side-panel,.exam-card,.practice-panel,.project-spec,.review-panel,.tool-comparison) p{font-size:15px;line-height:1.85}
body:not([data-view="welcome"]) :is(.side-panel,.review-panel) h3{font-size:18px;line-height:1.6;font-weight:600}
body:not([data-view="welcome"]) :is(input:not([type=radio]):not([type=checkbox]):not([type=file]),textarea,select){font-family:var(--font);font-size:16px;line-height:1.8;border:1px solid #bcbcc1;border-radius:12px;background:var(--surface);color:var(--ink);min-height:48px;max-width:100%;padding:12px 14px}
body:not([data-view="welcome"]) :is(textarea,select,input[type=search]):focus-visible{outline:3px solid var(--blue);outline-offset:3px}
body:not([data-view="welcome"]) :is(textarea,input)::placeholder{color:var(--muted);opacity:1}
body:not([data-view="welcome"]) :is(input[type=radio],input[type=checkbox]){accent-color:var(--blue);width:18px;height:18px;flex-shrink:0;margin-top:4px}
body:not([data-view="welcome"]) .btn:disabled{background:#ededf0;border-color:#d2d2d7;color:#626267;cursor:not-allowed;opacity:1;transform:none}
body:not([data-view="welcome"]) :is(.check-item,.option){min-height:48px;font-size:15px;line-height:1.8}
body:not([data-view="welcome"]) .chip{font-size:12px;line-height:1.6;padding:5px 9px;border-radius:8px;font-weight:500}
body:not([data-view="welcome"]) .chip-muted{color:var(--muted);background:#f5f5f7}
body:not([data-view="welcome"]) .lesson-number{color:var(--muted)}
body:not([data-view="welcome"]) .btn-light{background:#fff;border-color:#bcbcc1;color:var(--ink)}
body:not([data-view="welcome"]) ::selection{background:#dbeafe;color:var(--ink)}
.side-panel .mini-list{line-height:1.9}
.side-panel .mini-list li{margin-bottom:10px}
.sidebar-bottom{flex-shrink:0}
.sidebar-bottom .status-line strong{font-size:14px;font-variant-numeric:tabular-nums}
body:not([data-view="welcome"]) .sidebar-note{font-size:12px;line-height:1.85}
body:not([data-view="welcome"]) :is(button,a,summary){-webkit-tap-highlight-color:#0071e31a}
body:not([data-view="welcome"]) .btn:active{transform:translateY(1px)}

/* Wide task pages keep a readable primary column and a quiet supporting column. */
body:is([data-view="project"],[data-view="exams"]) .lesson-layout{display:grid;grid-template-columns:minmax(0,800px) minmax(220px,260px);gap:28px;align-items:start;justify-content:center}
body[data-view="project"] .lesson-article{padding:32px 36px;max-width:800px;width:100%;border:1px solid #e5e5ea;border-radius:24px}
body[data-view="project"] .project-spec{padding:0 0 24px;border:0;border-radius:0;border-bottom:1px solid var(--line);margin-bottom:28px}
body[data-view="project"] .lesson-section{margin-bottom:32px}
body[data-view="project"] .lesson-section h2{font-size:24px;font-weight:600;line-height:1.5}
body[data-view="project"] .lesson-section :is(p,li){font-size:16px;line-height:1.9}
body[data-view="project"] .step-list{padding-left:24px}
body[data-view="project"] .step-list li{margin-bottom:16px;padding-left:4px}
body[data-view="project"] .side-stack{gap:20px}
body[data-view="project"] .side-panel h2{font-size:18px}
body[data-view="project"] .ability-row{padding:20px 0;gap:12px;border-color:#e5e5ea}
body[data-view="project"] .ability-row :is(p,.btn){font-size:14px}
body[data-view="project"] .milestone{grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:start;padding:18px 0}

/* Knowledge answers remain separate from practice and mastery evidence. */
.exam-selector{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.exam-selector label{font-size:14px;color:var(--muted)}
.exam-selector select{width:min(100%,460px)}
body[data-view="exams"] .exam-card{padding:32px;margin-bottom:24px}
body[data-view="exams"] .question{border:0;padding:0 0 28px;margin:28px 0;border-bottom:1px solid #e5e5ea;min-width:0}
body[data-view="exams"] .question legend{font-size:17px;line-height:1.8;font-weight:600;margin:0 0 16px;padding:0;max-width:100%}
body[data-view="exams"] .option{align-items:flex-start;gap:12px;min-height:56px;padding:15px 16px;margin:10px 0;border:1px solid #d2d2d7;border-radius:14px;background:#fff;transition:background-color var(--motion-nav) ease,border-color var(--motion-nav) ease;overflow-wrap:anywhere}
body[data-view="exams"] .option input{margin-top:5px}
body[data-view="exams"] .option:hover{background:#f5f5f7;border-color:#86868b}
body[data-view="exams"] .option:has(input:checked):not(.is-correct):not(.is-wrong){background:var(--blue-soft);border-color:#78afe5}
body[data-view="exams"] .option:focus-within{outline:3px solid var(--blue);outline-offset:3px}
body[data-view="exams"] .option.is-correct{background:var(--success-bg);border-color:#8ab9ab;color:#236b5b}
body[data-view="exams"] .option.is-wrong{background:var(--danger-bg);border-color:#dcaaa5;color:var(--danger)}
.quiz-progress{font-size:14px!important;line-height:1.85;padding:12px 16px;background:#f5f5f7;color:var(--muted);border-radius:12px;margin:20px 0 0;font-variant-numeric:tabular-nums}
.correct-answer{display:block;margin:8px 0;font-weight:600}
body[data-view="exams"] .question .explanation{background:#f5f5f7;border-radius:14px;font-size:15px;line-height:1.9;padding:18px;margin-top:18px}
body[data-view="exams"] .quiz-result{background:var(--blue-soft);color:var(--ink);border-radius:16px;font-size:17px;line-height:1.8;margin:0}
body[data-view="exams"] .quiz-result p{font-size:14px;color:var(--muted);margin:10px 0 0}
body[data-view="exams"] .lesson-actions{align-items:flex-start;flex-wrap:wrap;gap:16px;padding-top:0;border:0}
body[data-view="exams"] .practice-panel{margin-top:24px}
body[data-view="exams"] .check-item{padding-block:12px}
body[data-view="exams"] .side-panel{background:transparent;border:0;padding-top:16px}
body[data-view="exams"] .side-panel h2{font-size:18px}
body[data-view="exams"] .side-panel li{font-size:14px;color:var(--muted);line-height:1.9}
.review-panel :is(label,select,textarea){max-width:100%}
.review-criterion{border-color:#e5e5ea;border-radius:14px;background:#f5f5f7;padding:18px}
.review-criterion strong{font-size:15px;line-height:1.8}
.review-criterion>span{font-size:14px;line-height:1.85;color:var(--muted)}
.review-optional,.review-history{border-color:#e5e5ea}
.review-optional>summary,.review-history>summary{min-height:44px;line-height:1.8;font-size:15px;cursor:pointer}
.form-error{color:var(--danger);font-size:15px;line-height:1.8}

/* Records: a centered honest empty state and readable existing artifacts. */
.notes-list{max-width:1040px;margin-inline:auto;gap:20px}
.notes-list.notes-is-empty{max-width:620px;padding-top:24px}
.notes-empty{padding:44px 36px;border:1px solid #e5e5ea;border-radius:24px;background:#fff;text-align:center}
.notes-empty-icon{display:inline-flex;justify-content:center;align-items:center;color:var(--muted);margin-bottom:20px}
.notes-empty-icon svg{width:40px;height:40px;stroke-width:1.5}
.notes-empty h2{font-size:24px;font-weight:600;line-height:1.5;margin:0 0 14px}
.notes-empty p{font-size:16px;line-height:1.9;color:var(--muted);margin:0 auto 24px;max-width:34ch}
.note-item .section-heading{padding:0 0 18px;gap:16px;flex-wrap:wrap}
.note-item h2,.note-item .section-heading h2{font-size:21px;font-weight:600;line-height:1.6}
.note-item>p{font-size:16px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:20px}

/* Search keeps the original semantics, matching logic and two-column index. */
.filter-bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.filter-bar label{font-size:14px;color:var(--muted)}
.filter-bar .search-field{width:min(100%,600px);flex:1;min-width:180px}
.glossary-grid{align-items:start;gap:0 32px;padding:8px 28px}
.glossary-item{border-color:#e5e5ea;min-width:0;padding:0}
.glossary-item>summary{display:grid;grid-template-columns:minmax(0,1fr) 20px;gap:6px 12px;padding:22px 0;min-height:80px;list-style:none;cursor:pointer}
.glossary-item>summary::-webkit-details-marker{display:none}
.glossary-term{font-size:20px;font-weight:600;line-height:1.5}
.glossary-alias{grid-column:1;font-size:13px;line-height:1.8;color:var(--muted);overflow-wrap:anywhere}
.glossary-item>summary>.chip{grid-column:1;justify-self:start;margin-top:4px}
.glossary-item>summary>svg{grid-column:2;grid-row:1/3;width:18px;height:18px;align-self:center;stroke-width:1.5;transition:transform var(--motion-card) ease}
.glossary-item[open]>summary>svg{transform:rotate(180deg)}
.glossary-detail{padding-bottom:24px}
.glossary-detail p{font-size:15px;line-height:1.9;color:var(--ink);margin:0 0 14px}
.glossary-empty{grid-column:1/-1;background:transparent;border:0;font-size:16px;line-height:1.9;padding:36px 20px}

/* Existing official entries and the detailed capability comparison coexist. */
.tool-entry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:24px 0 12px}
.tool-entry{background:#fff;border:1px solid #e5e5ea;border-radius:20px;padding:24px;transition:transform var(--motion-card) ease,border-color var(--motion-card) ease;min-width:0}
.tool-entry h3{font-size:22px;font-weight:600;line-height:1.5;margin:0 0 10px}
.tool-entry p{font-size:15px;line-height:1.85;color:var(--muted);margin:0 0 18px}
.tool-entry .btn{font-size:14px;text-align:left;max-width:100%;flex-wrap:wrap}
.tool-entry svg{width:17px;height:17px;stroke-width:1.5}
body[data-view="resources"] .learning-evidence{padding:0;border:0;border-radius:0;background:transparent;margin:0 0 32px}
body[data-view="resources"] .learning-evidence>p{max-width:75ch}
body[data-view="resources"] .tool-comparison{margin-top:0}
body[data-view="resources"] .table-wrap{overflow-x:auto;overscroll-behavior-inline:contain;border-radius:14px;border:1px solid #e5e5ea;max-width:100%}
body[data-view="resources"] table{min-width:720px;table-layout:fixed;font-size:14px}
body[data-view="resources"] th,body[data-view="resources"] td{padding:16px;line-height:1.85;overflow-wrap:anywhere;border-color:#e5e5ea}
body[data-view="resources"] th{background:#f5f5f7}
body[data-view="resources"] th:first-child{width:18%}
body[data-view="resources"] .resource-list{max-width:none;margin:28px 0;padding:8px 28px}
body[data-view="resources"] .resource-link{padding:22px 0;min-height:64px;gap:20px}
body[data-view="resources"] .resource-link strong{font-size:17px;font-weight:600}
body[data-view="resources"] .resource-link span span{font-size:14px;line-height:1.85;color:var(--muted)}
body[data-view="resources"] .lesson-section>h2{font-size:26px;font-weight:600;margin-top:36px}

body[data-view="extensions"] .extension-panel{padding:0;border:1px solid #e5e5ea;margin-bottom:28px;overflow:hidden}
body[data-view="extensions"] .extension-panel>.section-heading{padding:24px 28px;gap:16px;flex-wrap:wrap}
body[data-view="extensions"] .section-heading h2{font-size:24px;font-weight:600;line-height:1.5}
body[data-view="extensions"] .route-description{padding:0 28px;margin:20px 0;font-size:15px;line-height:1.9;color:var(--muted)}
body[data-view="extensions"] .extension-panel>.btn{margin:0 28px 20px}
body[data-view="extensions"] .stage-summary{padding:22px 28px;gap:14px;align-items:center}
body[data-view="extensions"] .stage-title{font-size:18px;font-weight:600;line-height:1.6}
body[data-view="extensions"] .stage-subtitle{font-size:13px;line-height:1.8;color:var(--muted)}
body[data-view="extensions"] .stage-lessons{padding:0 28px 24px 78px}
body[data-view="extensions"] .lesson-row{padding:16px 0;min-height:66px;gap:12px}
body[data-view="extensions"] .lesson-title{font-size:15px;line-height:1.8}
body[data-view="extensions"] :is(.lesson-meta,.lesson-status,.stage-meta){font-size:13px;color:var(--muted)}
body[data-view="extensions"] .stage-index{color:var(--muted);background:#f5f5f7;border-color:#e5e5ea;border-radius:12px}
body[data-view="extensions"] .stage-exam{background:#f5f5f7;gap:10px;flex-wrap:wrap;border-radius:14px;padding:12px}
body[data-view="extensions"] .stage-exam .text-muted{font-size:13px;line-height:1.85}
@media(hover:hover){.tool-entry:hover{transform:translateY(-3px);border-color:#bcbcc1}}

  platformGuide: [

      "shared": "复制资料与任务说明，核对结果，迭代提示词。",

  stages: [
    {
      id: 's1', title: '先把任务说清楚', subtitle: '提示词 · 资料边界 · 项目文档',
      goal: '不用编程，先证明你知道这个助手应该怎样回答。',
      lessons: [
        {
          id: 's1-l1', title: '第一份资料，三个问题', minutes: 20, level: '基础',
          intro: '先做一份有标准答案的小练习，以后每次改程序都能用它检查。',
          explain: [
            "这一课先用一份简短的项目说明练习：找出答案、标出出处，并识别资料没有覆盖的问题。可以在 DeepSeek、ChatGPT 等聊天工具中直接粘贴材料，不需要先安装编程环境。",

          ],
          knowledge: [
            {
              "title": "先分清：材料写了什么，现实是否如此",
              "paragraphs": [
                "事实是可以核查的情况，主张是某个主体表达的判断。本课首先核查的是“材料是否这样写”，不直接证明这套方法适合所有项目。例如，原文约定“开工前准备三份小文档”，可以支持本教学示例中确有这项约定；不能据此说“所有项目都必须这样做”。回答时保留“本教学示例约定”这个范围，才没有把练习规则扩大成普遍事实。"
              ]
            },
            {
              "title": "证据必须支撑答案里的那句话",
              "paragraphs": [
                "证据是用来支持判断的可检查信息。第2段列出三份文档，就能支持它们的名称；这段没有谈接口费用，就不能支持任何价格。判断证据是否够用，要把答案拆成具体说法，再逐句问‘原文哪句话支持它’。一段相关文字不一定支持整段答案；答案偷偷增加的‘一定更快’或‘保证成功’，也要单独找依据。"
              ]
            },
            {
              "title": "引用是寻找证据的地址",
              "paragraphs": [
                "引用告诉读者去哪里核对，原文才提供实际内容。‘资料第2段’只有在文件和段落能准确找到时才有用。错误示例是答案列出三份文档，却引用讲Git的第4段；虽然段号存在，引用仍不成立。正确判断同时看两件事：这个地址能否定位原文，定位后的原文是否真的支持答案。只检查有没有括号或段号，容易漏掉假引用。"
              ]

              "title": "有答案和无答案，要分别检查",

              ]
            },
            {
              "title": "预期答案是判断尺，不是背诵稿",
              "paragraphs": [

              ]
            }
          ],
          knowledgeSources: [{"title":"OpenAI：任务指令与上下文","url":"https://developers.openai.com/api/docs/guides/prompt-engineering"}],
          steps: [
            "打开练习资料，阅读第 2 段和第 4 段。",
            "写下“开工前要准备哪三份文档？”和“Git能找回所有未保存改动吗？”的预期回答，分别标出第 2 段和第 4 段。",
            "再写下“模型接口多少钱”，预期行为标为“资料未提供”。把三项存进 tests.md。"
          ],
          example: {
            "label": "第一条测试记录",
            "text": "问题：开工前要准备哪三份文档？\n预期：本教学示例约定准备项目需求、处理流程、当前进度。\n依据：资料助手项目说明.txt，第 2 段。"

  }
  function normalize(raw) {
    if (!raw || raw.version !== 1 || !Array.isArray(raw.completed)) throw Error('这不是本学习台的记录文件，请选择之前导出的 JSON。');

    lessons.forEach(l => {
      if (typeof raw.notes?.[l.id] === 'string') clean.notes[l.id] = raw.notes[l.id].slice(0, 20000);
      if (Array.isArray(raw.checks?.[l.id])) clean.checks[l.id] = l.checks.map((_, i) => raw.checks[l.id][i] === true);
    });
    D.stages.forEach(s => {
      const a = raw.examAnswers?.[s.id];
      if (Array.isArray(a)) clean.examAnswers[s.id] = s.exam.questions.map((q, i) => Number.isInteger(a[i]) && a[i] >= 0 && a[i] < q.options.length ? a[i] : null);
      if (raw.examResults?.[s.id] && clean.examAnswers[s.id]?.every(x => x !== null)) clean.examResults[s.id] = { score: s.exam.questions.filter((q, i) => clean.examAnswers[s.id][i] === q.answer).length };
      if (typeof raw.practiceNotes?.[s.id] === 'string') clean.practiceNotes[s.id] = raw.practiceNotes[s.id].slice(0, 20000);
      if (Array.isArray(raw.practiceChecks?.[s.id])) clean.practiceChecks[s.id] = s.exam.checks.map((_, i) => raw.practiceChecks[s.id][i] === true);
    });
    clean.lastLesson = lessons.some(l => l.id === raw.lastLesson) ? raw.lastLesson : '';

  try { const saved = localStorage.getItem(KEY); if (saved) state = normalize(JSON.parse(saved)); } catch { storageWarning(); }

    const text = key => typeof raw[key] === 'string' ? raw[key].slice(0, 20000) : '';

  }
  function normalizeFeedback(raw) {

    }

      const v=raw.drills?.[d.id];
      if(v&&Number.isInteger(v.answer)&&v.answer>=0&&v.answer<d.options.length)clean.drills[d.id]={answer:v.answer,why:typeof v.why==='string'?v.why.slice(0,4000):''};
    }
    return clean;
  }
  try { const saved=localStorage.getItem(FEEDBACK_KEY); if(saved)learning=normalizeFeedback(JSON.parse(saved)); } catch { storageWarning(); }
  function saveFeedback() {

  function invalidatePeerReview(s) {

  }
  const draftFor = id => learning.drafts[id] ||= cleanDraft();

  function reviewFindings(s,r) {
    const gaps=[];
    if(!r.artifact?.trim())gaps.push('先提交真实成果或可检查摘录，不只写“已完成”。');
    if(r.mode!=='actual')gaps.push('当前是准备练习或尚未说明方式：实际操作仍待练，不计实操达标。');
    if(!r.process?.trim())gaps.push('补充原任务、用了什么工具及实际核对过程。');
    s.exam.checks.forEach((c,i)=>{if(!r.checks?.[i]||!r.evidence?.[i]?.trim())gaps.push(`标准${i+1}未完成自查或缺依据：${S.rubrics[s.id].evidence[i]}`);});
    if(r.independent&&!r.independentEvidence?.trim())gaps.push('已选择独立换题，但缺少新材料、新要求与独立结果的对照证据。');
    if(r.source==='peer'&&(!r.reviewer?.trim()||!r.verdict))gaps.push('人工复核缺少具体意见或结论，请先补齐；不能仅填“通过”。');
    if(r.source==='peer'&&r.verdict==='revise')gaps.push('人工复核要求修改：按复核意见修正，留下复验结果再提交。');
    return gaps;
  }
  function reviewLabel(s,r) {
    if(!r)return '未评估';

    if(reviewFindings(s,r).length)return '需改进或补证';
    return r.source==='peer'?'人工复核达标（本人记录）':'自评材料齐全 · 待核验';
  }
  const snapshot = s => ({...cleanDraft(draftFor(s.id)),artifact:state.practiceNotes[s.id]||'',checks:s.exam.checks.map((_,i)=>state.practiceChecks[s.id]?.[i]===true)});
  const changedReview = s => {const r=latestReview(s.id);if(!r)return false;const {at,...prior}=r;return JSON.stringify(prior)!==JSON.stringify(snapshot(s));};
  function dateText(at) {const d=new Date(at);return Number.isNaN(d.valueOf())?'时间未记录':d.toLocaleString('zh-CN',{hour12:false});}
  function feedbackResult(s,r) {
    if(!r)return '<p class="empty-feedback">尚未提交评估。先保存作品，再填写核对依据；课程勾选和知识题不会自动填满这里。</p>';

xtarea class="notes-field" id="reviewer" data-review-field="reviewer" rows="3" maxlength="20000" placeholder="对方检查了什么？指出哪里需改？只记必要称呼，不填私人联系方式。">${esc(d.reviewer)}</textarea><label for="reviewVerdict">人工复核结论</label><select id="reviewVerdict" data-review-field="verdict"><option value="">尚未记录</option><option value="pass" ${d.verdict==='pass'?'selected':''}>对方确认本次成果符合上述标准</option><option value="revise" ${d.verdict==='revise'?'selected':''}>对方指出仍需改进</option></select><p class="text-muted">这是你填写的人工复核记录，平台没有验证复核人身份，也没有自动认定毕业。</p></details>${r?`<label class="notes-field" for="reviewChange">这次修改了什么，怎样复验？</label><textarea class="notes-field" id="reviewChange" data-review-field="change" rows="3" maxlength="20000" placeholder="对照上次反馈，说明本次改动和检查结果">${esc(d.change)}</textarea>`:''}<p id="reviewError" class="form-error" role="alert" hidden></p><p id="reviewDraftStatus" class="text-muted" role="status">${changedReview(s)?'草稿已修改，尚未重新提交；下面的反馈属于上一次成果。':'填写后自动暂存；提交才生成一次反馈记录。'}</p><button class="btn btn-primary" data-submit-review="${s.id}">${r?'修改后重新提交':'提交成果并查看反馈'}</button><div id="reviewFeedback">${feedbackResult(s,r)}</div>${history.length?`<details class="review-history"><summary>查看 ${history.length} 次提交与修改记录</summary>${[...history].reverse().map((v,i)=>`<article><h3>第 ${history.length-i} 次 · ${esc(dateText(v.at))}</h3><p>${esc(reviewLabel(s,v))}</p><p class="saved-artifact">${esc(v.artifact)}</p>${v.change?`<p>修改与复验：${esc(v.change)}</p>`:''}<details><summary>查看当次核对依据与反馈</summary><p>${esc(v.process)}</p><ol>${v.evidence.map(x=>`<li>${esc(x||'未填写')}</li>`).join('')}</ol>${feedbackResult(s,v)}</details></article>`).join('')}</details>`:''}</section>`;

    {name:'项目需求.md',text:'# 个人资料问答 Agent · 项目需求\n\n## 我要解决的问题\n从自己的资料中找到答案，并能核对出处。\n\n## 第一版范围\n- 读取一份 TXT 文件。\n- 回答时给出文件名和段落编号。\n- 资料没有答案时明确说明，不编造。\n\n## 我的验收问题\n1. 有依据的问题：\n2. 有依据的问题：\n3. 资料没有答案的问题：\n\n## 暂时不做\n多用户、自动联网、多智能体。\n'},
    {name:'处理流程.md',text:'# 处理流程\n\n## 第一版流程\n读取 TXT → 划分并编号段落 → 找到相关段落 → 带着证据提问模型 → 显示回答和引用\n\n## 文件职责（学习时逐步实现）\n- 资料：原始 TXT，不覆盖源文件。\n- 程序：读取、检索、调用模型和显示结果。\n- 配置：从环境读取密钥，不写进代码。\n\n## 我当前实际实现的流程\n待填写。\n\n## 我还不能解释的步骤\n待填写。\n'},
    {name:'当前进度.md',text:'# 当前进度\n\n## 已实际完成\n尚未记录，请填写自己运行和验证过的结果。\n\n## 运行方式\n待填写。\n\n## 最近一次测试\n- 输入：\n- 实际输出：\n- 证据与出处：\n- 结果：\n\n## 当前卡点\n待填写。\n\n## 下一步\n完成当前关卡的一项小任务。\n\n## Git 存档\n提交编号：待实际提交后填写。\n'}
  ]; }
  $('#exportBtn').addEventListener('click',()=>{download('AI学习记录_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({...state,...(learning.first.text||Object.keys(learning.drafts).length||Object.keys(learning.drills).length||Object.values(learning.submissions).some(a=>a.length)?{learningFeedback:learning}:{})},null,2),'application/json');notify('已导出记录，请妥善保存文件。');});
  $('#importBtn').addEventListener('click',()=>$('#importFile').click());
  $('#importFile').addEventListener('change',async e=> {
    const file=e.target.files[0];if(!file)return;
    try {const raw=JSON.parse(await file.text());const imported=normalize(raw),feedback=normalizeFeedback(raw.learningFeedback);if(!confirm('导入会替换当前浏览器的课程、笔记和反馈记录；旧文件不含新增反馈。建议先导出备份。现在导入吗？'))return;state=imported;learning=feedback;const savedState=save(),savedFeedback=saveFeedback(),ok=savedState&&savedFeedback;render();notify(ok?'已导入学习记录。':'已载入记录，请导出备份，当前浏览器无法保存。');}catch(error){notify(error instanceof SyntaxError?'文件无法解析，请选择有效的 JSON 记录。':error.message);}finally{e.target.value='';}
  });
  $('#menuToggle').addEventListener('click',()=>$('#mobileMenu').showModal());
  $('#closeMenu').addEventListener('click',()=>$('#mobileMenu').close());
  $('#mobileMenu').addEventListener('click',e=>{if(e.target===$('#mobileMenu'))$('#mobileMenu').close();});
  const detailAnimations = new WeakMap();
  document.addEventListener('click', e => {
    const summary = e.target.closest('summary');
    if (!summary || e.target.closest('button,a,input') || matchMedia('(prefers-reduced-motion: reduce)').matches || !summary.parentElement.animate) return;
    const details = summary.parentElement;
    if (!details.matches('.stage-item,.stage-card-details,.capability-detail,.glossary-item')) return;
    e.preventDefault();
    const previous = detailAnimations.get(details), opening = previous ? !previous.opening : !details.open;
    const from = details.getBoundingClientRect().height;
    if (previous) previous.animation.cancel();
    details.open = true;
    details.style.height = ''; details.style.overflow = '';
    const to = opening ? details.getBoundingClientRect().height : summary.getBoundingClientRect().height;
    details.style.overflow = 'hidden';
    const animation = details.animate([{height:from+'px'},{height:to+'px'}], {duration:250,easing:'cubic-bezier(.16,1,.3,1)'});
    const entry = {animation,opening}; detailAnimations.set(details,entry);
    animation.finished.then(() => {
      if (detailAnimations.get(details) !== entry) return;
      details.open = opening; details.style.overflow = ''; detailAnimations.delete(details);
    }).catch(()=>{});
  });
  window.addEventListener('hashchange',render);
  render();
})();

</script>
